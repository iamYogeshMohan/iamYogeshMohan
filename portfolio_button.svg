<svg xmlns="http://www.w3.org/2000/svg" width="180" height="45" viewBox="0 0 180 45">
  <defs>
    <!-- Purple to Neon Cyan Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e0249" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Oval/Capsule Background -->
  <rect x="2" y="2" width="176" height="41" rx="20.5" ry="20.5" fill="url(#neonGradient)" stroke="#00f0ff" stroke-width="1.5" filter="url(#neonGlow)" />

  <!-- Text -->
  <text x="90" y="27" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    🌐 My Portfolio
  </text>
</svg>
